[alembic]
script_location = migrations
path_separator = os
version_path_separator = os
prepend_sys_path = .

# sqlalchemy.url is intentionally NOT hardcoded here. env.py reads
# DATABASE_URL from the environment (14 §33: SECRETS AND
# CONFIGURATION — no secret/connection string lives in a tracked
# file). See infra/local/.env.example for the local default.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
