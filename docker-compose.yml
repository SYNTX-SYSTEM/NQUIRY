# Local development environment (14 §2.1, §38 LOCAL DEVELOPMENT AND MOCKS).
#
# `docker compose up` starts only `postgres`, satisfying the Phase 0
# gate ("DB starts") without pretending the api/worker/web containers
# already do anything beyond a toolchain boot proof. Start those too
# explicitly with the `app` profile:
#   docker compose --profile app up
#
# MockProvider (14 §38) is an in-process adapter
# (`packages/ai_gateway/adapters/providers/mock.py`, PKG-19) — no
# separate mock-provider container exists at this build phase.

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nquiry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nquiry_local_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-nquiry}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - nquiry_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nquiry}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/local/api.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://nquiry:nquiry_local_dev_only@postgres:5432/nquiry}
    ports:
      - "8000:8000"

  worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/local/worker.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://nquiry:nquiry_local_dev_only@postgres:5432/nquiry}

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/local/web.Dockerfile
    depends_on:
      - api
    environment:
      # Local-login field: where the root route (`/`) sends a logged-in
      # visitor with no Workspace-list UI yet -- the one demo Session
      # `scripts/seed_local_demo.py` creates. Optional; unset in a
      # deployment with no demo scenario seeded.
      NEXT_PUBLIC_DEFAULT_WORKSPACE_ID: ${NEXT_PUBLIC_DEFAULT_WORKSPACE_ID:-01a0c312-0255-785f-9355-407c261f1f7b}
      NEXT_PUBLIC_DEFAULT_SESSION_ID: ${NEXT_PUBLIC_DEFAULT_SESSION_ID:-01a0c312-0267-71b1-8c8d-b4508080dada}
    ports:
      - "3000:3000"

volumes:
  nquiry_postgres_data:
